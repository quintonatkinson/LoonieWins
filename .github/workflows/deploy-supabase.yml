# Deploys every Supabase Edge Function (ingest, offer walls, AdMob, push, digest, RevenueCat).
# Runs automatically when supabase/functions changes on main, or manually:
#   GitHub → Actions → "Deploy Supabase functions" → Run workflow.
#
# One-time repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  Supabase → Account (top-right avatar) → Access Tokens → Generate
#   SUPABASE_PROJECT_REF   the id in your project URL: https://<THIS>.supabase.co
# Per-function JWT settings come from supabase/config.toml.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repo secrets first."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
