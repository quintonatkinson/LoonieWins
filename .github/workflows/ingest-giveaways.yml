# Continuously refresh the giveaway Hive Mind via the ingest Edge Function.
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              = https://oftunznsumfidavvbqz.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY = service_role JWT from Supabase → Settings → API
# Optional Edge secret (supabase secrets set):
#   RSS2JSON_API_KEY          = paid rss2json key for fatter pages (count=100)
name: Ingest giveaways

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest-giveaways
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secrets — skip."
            exit 0
          fi
          curl -sS -X POST "${SUPABASE_URL}/functions/v1/ingest-giveaways" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/ingest.json
          python3 -c "import json; d=json.load(open('/tmp/ingest.json')); print('upserted', d.get('upserted'), 'ok', d.get('ok'), 'sources', d.get('sources')); raise SystemExit(0 if d.get('ok') else 1)"
