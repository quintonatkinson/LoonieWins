# Deploy Edge Functions after supabase/functions changes on main, then run verify backfill.
# Requires repo secrets: SUPABASE_ACCESS_TOKEN (CLI deploy), SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy-and-backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ingest-giveaways
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN — skip deploy (set in repo Actions secrets)."
            exit 0
          fi
          supabase functions deploy ingest-giveaways --project-ref ofutnznsyumfidavvbqz

      - name: Deploy verify-contest-links
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Skip verify-contest-links deploy — no access token."
            exit 0
          fi
          supabase functions deploy verify-contest-links --project-ref ofutnznsyumfidavvbqz

      - name: Verify backfill (resolveUrls)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing Supabase URL/service key — skip backfill."
            exit 0
          fi
          for i in 1 2; do
            echo "=== verify pass $i ==="
            curl -sS -X POST "${SUPABASE_URL}/functions/v1/verify-contest-links" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"limit":300,"olderThanHours":168,"resolveUrls":true}' \
              | tee "/tmp/verify-backfill-$i.json"
            python3 -c "import json; d=json.load(open('/tmp/verify-backfill-$i.json')); print('pass', $i, 'scanned', d.get('scanned'), 'urlsResolved', d.get('urlsResolved'), 'updated', d.get('updated'), 'ok', d.get('ok'))"
          done